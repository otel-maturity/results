# istio/gateway chart values for OTel evaluation
# Deploys the Istio Ingress Gateway

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

service:
  type: NodePort
  ports:
    - name: http2
      port: 80
      targetPort: 8080
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
