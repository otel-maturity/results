---
# Istio Gateway — accepts HTTP traffic on port 80
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: otel-eval-gateway
  namespace: demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
# VirtualService — routes all traffic to the otel-eval-backend
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: otel-eval-backend
  namespace: demo
spec:
  hosts:
    - "*"
  gateways:
    - otel-eval-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: otel-eval-backend
            port:
              number: 3000
