mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.150.1"

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

presets:
  clusterMetrics:
    enabled: true
  # logsCollection is disabled — it injects a filelog receiver with hostPath
  # mounts (/var/lib/docker/containers) that don't exist in kind (containerd).
  # Logs are collected via OTLP push instead.
  logsCollection:
    enabled: false
  # kubeletMetrics is disabled — the kubeletstats receiver needs DaemonSet mode
  # and kubelet auth that's unreliable in a minimal kind cluster.
  kubeletMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true

# Let the chart auto-generate ClusterRole rules based on enabled presets.
# Custom rules here would override the chart defaults and break receivers
# (k8s_cluster needs events, namespaces, deployments, replicasets, etc.).
clusterRole:
  create: true

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

extraVolumes:
  - name: otel-output
    hostPath:
      path: /tmp/otel
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: otel-output
    mountPath: /tmp/otel

config:
  processors:
    memory_limiter:
      check_interval: 2s
      limit_percentage: 75
      spike_limit_percentage: 15

    batch:
      timeout: 5s
      send_batch_size: 512

    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
          - k8s.container.name
        labels:
          - from: pod
            key_regex: (.*)
            tag_name: k8s.pod.label.$${1}
        annotations:
          - from: pod
            key_regex: (.*)
            tag_name: k8s.pod.annotation.$${1}
      passthrough: false
      pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection

  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}

    # Prometheus scrape configs for Istio telemetry
    prometheus:
      config:
        scrape_configs:
          # Istiod control plane metrics (port 15014)
          - job_name: istio-istiod
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - istio-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                action: keep
                regex: istiod;http-monitoring
            metrics_path: /metrics

          # Istio ingress gateway metrics (port 15021)
          - job_name: istio-ingressgateway
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - istio-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_istio]
                action: keep
                regex: gateway
              - source_labels: [__meta_kubernetes_pod_ip]
                action: replace
                target_label: __address__
                replacement: $${1}:15020
            metrics_path: /stats/prometheus

          # Envoy sidecar metrics from all injected pods (port 15090)
          - job_name: istio-envoy-sidecars
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              # Only scrape pods with the istio-proxy sidecar
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape, __meta_kubernetes_pod_container_name]
                action: keep
                regex: (true;.*|.*;istio-proxy)
              - source_labels: [__meta_kubernetes_pod_annotation_sidecar_istio_io_status]
                action: keep
                regex: .+
              - source_labels: [__meta_kubernetes_pod_ip]
                action: replace
                target_label: __address__
                replacement: $${1}:15090
            metrics_path: /stats/prometheus

  exporters:
    file/traces:
      path: /tmp/otel/traces.jsonl
      format: json
    file/metrics:
      path: /tmp/otel/metrics.jsonl
      format: json
    file/logs:
      path: /tmp/otel/logs.jsonl
      format: json
    debug:
      verbosity: detailed

  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - file/traces
          - debug
      metrics:
        receivers:
          - otlp
          - k8s_cluster
          - prometheus
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - file/metrics
          - debug
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - file/logs
          - debug
