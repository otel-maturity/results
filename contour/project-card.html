<!--
==============================================================================
  PROJECT CARD TEMPLATE
  Copy this entire block and paste it inside <div class="card-grid"> in
  index-template.html. Replace every {{ PLACEHOLDER }} with real values.

  SCORE VALUES: 0 · 1 · 2 · 3  (use the matching CSS class: score-0 … score-3)
  SIGNAL STATUS classes on <span class="signal-dot ...">:
    flowing  → green  (signal fully supported via OTLP or Prometheus)
    partial  → orange (signal exists but incomplete / requires setup)
    none     → grey   (signal not supported)
==============================================================================
-->

<!-- Contour -->
<a class="project-card" href="contour/report.html">
  <div class="card-inner">
    <div class="card-content">

      <!-- ── Top row: logo · name · version ── -->
      <div class="card-top">
        <img class="project-logo"
             src="https://raw.githubusercontent.com/cncf/artwork/main/projects/contour/icon/color/contour-icon-color.svg"
             alt="Contour">
        <div class="project-name">Contour</div>
        <span class="project-version">v1.32.1</span>
      </div>

      <!-- ── Category tag + one-line description ── -->
      <div class="card-meta">
        <span class="category-tag">Ingress Controller</span>
        <span class="sep">&middot;</span>
        <span class="card-desc">CNCF Incubating Kubernetes ingress controller powered by Envoy</span>
      </div>

      <!--
        ── Score pills ──
        Order: Integration · Semantics · Resources · Tracing · Multi-Signal · Quality · Stability
        Set class to score-0, score-1, score-2, or score-3 for each dimension.
      -->
      <div class="score-pills">
        <span class="score-pill score-1" title="Integration">1</span>
        <span class="score-pill score-0" title="Semantics">0</span>
        <span class="score-pill score-1" title="Resources">1</span>
        <span class="score-pill score-2" title="Tracing">2</span>
        <span class="score-pill score-1" title="Multi-Signal">1</span>
        <span class="score-pill score-1" title="Quality">1</span>
        <span class="score-pill score-1" title="Stability">1</span>
      </div>

      <!--
        ── Signal pills ──
        Add or remove <span> rows as needed. Typical set: Traces, Metrics, Logs.
        dot class: flowing | partial | none
      -->
      <div class="card-signals">
        <span class="signal-pill"><span class="signal-dot flowing"></span> Traces (OTLP gRPC)</span>
        <span class="signal-pill"><span class="signal-dot partial"></span> Metrics (Prometheus only)</span>
        <span class="signal-pill"><span class="signal-dot none"></span> Logs (stdout only)</span>
      </div>

      <div class="view-report">View report <span class="arrow">&rarr;</span></div>
    </div>

    <!-- ── Radar chart ── -->
    <div class="card-chart">
      <div class="mini-chart">
        <canvas id="chart-contour"></canvas>
      </div>
    </div>
  </div>
</a>

<!--
  Register chart scores for this card.
  Place this <script> block right after the <a> tag above (or collect all
  registerChart() calls in a single <script> at the bottom of the file).
  Score order: Integration, Semantics, Resources, Tracing, Multi-Signal, Quality, Stability
-->
<script>
registerChart('chart-contour', [
  1,   // Integration
  0,   // Semantics
  1,   // Resources
  2,   // Tracing
  1,   // Multi-Signal
  1,   // Quality
  1    // Stability
]);
</script>
