# HTTPProxy routing otel-eval.local → otel-eval-backend in the demo namespace.
# Contour uses this to configure Envoy's routing rules.
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  name: otel-eval-backend
  namespace: demo
spec:
  virtualhost:
    fqdn: otel-eval.local
  routes:
    - conditions:
        - prefix: /
      services:
        - name: otel-eval-backend
          port: 3000
