## Contour Helm values for otel-eval-contour kind cluster
## Chart: bitnami/contour v21.1.4 (app version 1.32.1)

contour:
  enabled: true
  ## Expose metrics port for Prometheus scraping
  service:
    ports:
      xds: 8001
      metrics: 8000

envoy:
  enabled: true
  service:
    type: ClusterIP
    ports:
      http: 80
      https: 443
      metrics: 8002
    ## Expose the metrics port so the OTel collector can scrape it
    exposeMetrics: true

  ## Use host ports is off — not needed in kind
  useHostPort:
    http: false
    https: false
    metrics: false

## No ServiceMonitor (no Prometheus Operator in this cluster)
metrics:
  serviceMonitor:
    enabled: false
  prometheusRule:
    enabled: false
