replicaCount: 1

# kind cluster has no LoadBalancer
service:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 30080

adminService:
  create: true
  type: ClusterIP
  port: 8877

# Prometheus scrape annotations so the collector can discover this pod
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8877"
  prometheus.io/path: "/metrics"

# Reduce resource usage for eval cluster
resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "1000m"

# Disable agent (requires Ambassador Cloud)
agent:
  enabled: false
