replicaCount: 1

image:
  repository: docker.io/datawire/emissary
  tag: "3.12.2"
  pullPolicy: IfNotPresent

# Use NodePort so we can port-forward in kind (LoadBalancer not supported)
service:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: https
    port: 443
    targetPort: 8443

# Admin service exposes Prometheus /metrics on port 8877
adminService:
  create: true
  type: ClusterIP
  port: 8877

# Enable default Listeners (HTTP on 8080, HTTPS on 8443)
createDefaultListeners: true

# Reduced resources for kind cluster
resources:
  limits:
    cpu: 1000m
    memory: 600Mi
  requests:
    cpu: 200m
    memory: 300Mi

# Prometheus scrape annotations on pods
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8877"
  prometheus.io/path: "/metrics"

# Disable agent (requires Ambassador Cloud token)
agent:
  enabled: false

# Disable diagnostics UI
module:
  diagnostics:
    enabled: false
    allow_non_local: false

# Disable autoscaling
autoscaling:
  enabled: false

# Tolerate control-plane taint in kind
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
