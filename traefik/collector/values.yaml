mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.150.1"

resources:
  limits:
    memory: 512Mi
  requests:
    memory: 256Mi

presets:
  clusterMetrics:
    enabled: true
  # logsCollection is disabled — it injects a filelog receiver with hostPath
  # mounts (/var/lib/docker/containers) that don't exist in kind (containerd).
  # Logs are collected via OTLP push instead.
  logsCollection:
    enabled: false
  # kubeletMetrics is disabled — the kubeletstats receiver needs DaemonSet mode
  # and kubelet auth that's unreliable in a minimal kind cluster.
  kubeletMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true

# Let the chart auto-generate ClusterRole rules based on enabled presets.
clusterRole:
  create: true

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

extraVolumes:
  - name: otel-output
    hostPath:
      path: /tmp/otel-eval-traefik
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: otel-output
    mountPath: /tmp/otel-eval-traefik

config:
  processors:
    memory_limiter:
      check_interval: 2s
      limit_percentage: 75
      spike_limit_percentage: 15

    batch:
      timeout: 5s
      send_batch_size: 512

    k8sattributes:
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
          - k8s.container.name
        labels:
          - from: pod
            key_regex: (.*)
            tag_name: k8s.pod.label.$1
        annotations:
          - from: pod
            key_regex: (.*)
            tag_name: k8s.pod.annotation.$1
      passthrough: false
      pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection

  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}
    prometheus:
      config:
        scrape_configs:
          - job_name: traefik
            scrape_interval: 15s
            static_configs:
              - targets:
                  - traefik-metrics.traefik.svc.cluster.local:9100

  exporters:
    file/traces:
      path: /tmp/otel-eval-traefik/traces.jsonl
      format: json
    file/metrics:
      path: /tmp/otel-eval-traefik/metrics.jsonl
      format: json
    file/logs:
      path: /tmp/otel-eval-traefik/logs.jsonl
      format: json
    debug:
      verbosity: detailed

  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - file/traces
          - debug
      metrics:
        receivers:
          - otlp
          - k8s_cluster
          - prometheus
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - file/metrics
          - debug
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8sattributes
          - batch
        exporters:
          - file/logs
          - debug
