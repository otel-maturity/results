# Traefik Helm values for OTel evaluation
# Chart: traefik/traefik v40.2.0 (App: v3.7.1)

# Tracing via OTLP gRPC to the OTel Collector
tracing:
  addInternals: true
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# Metrics: both Prometheus (default) and OTLP
metrics:
  addInternals: true
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true
  otlp:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# Enable experimental OTLP logs feature
experimental:
  otlpLogs: true

# Logs configuration - general logs and access logs via OTLP
logs:
  general:
    level: INFO
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
        insecure: true
  access:
    enabled: true
    format: json
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
        insecure: true

# Expose the Traefik dashboard and API (insecure for eval)
ingressRoute:
  dashboard:
    enabled: true
    matchRule: "PathPrefix(`/dashboard`) || PathPrefix(`/api`)"
    entryPoints: ["web"]

# Service type: ClusterIP
service:
  type: ClusterIP

# Ports
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
  websecure:
    port: 8443
    expose:
      default: true
      exposedPort: 443
  metrics:
    port: 9100
    expose:
      default: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false
