# Traefik Helm values for OTel evaluation
# Chart: traefik/traefik v40.2.0 (app v3.7.1)

deployment:
  replicas: 1

# Expose the web entrypoint on port 8000 (non-privileged, avoids 8080 used by dashboard)
# and metrics on 9100
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  metrics:
    port: 9100
    expose:
      default: false
    protocol: TCP

# Create a dedicated ClusterIP service for Prometheus scraping
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true
  # OTLP push metrics
  addInternals: true
  otlp:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    pushInterval: "10s"
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# Enable OTLP tracing
tracing:
  addInternals: true
  serviceName: traefik
  sampleRate: 1.0
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# Enable experimental OTLP log export
experimental:
  otlpLogs: true

# Structured JSON logs + OTLP export
logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
        insecure: true

# Use ClusterIP in kind (LoadBalancer stays <pending>)
service:
  type: ClusterIP

# Allow scheduling on control-plane node in kind
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
