# Traefik Helm values for OTel evaluation
# Chart: traefik/traefik v40.2.0 (app v3.7.1)

deployment:
  replicas: 1

# --- Tracing: OTLP gRPC ---
tracing:
  addInternals: true
  serviceName: traefik
  sampleRate: 1.0
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# --- Metrics: OTLP gRPC push + Prometheus scrape ---
metrics:
  addInternals: true
  otlp:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    pushInterval: "10s"
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true   # creates traefik-metrics ClusterIP service on port 9100

# --- Logs: OTLP gRPC (experimental feature gate) ---
experimental:
  otlpLogs: true

logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
        insecure: true

# --- Entrypoints ---
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
  metrics:
    port: 9100
    expose:
      default: false

# --- Service (ClusterIP for kind, avoid pending LoadBalancer) ---
service:
  type: ClusterIP
