# Traefik Helm values for OTel evaluation
# Chart: traefik/traefik v40.0.0 (app v3.7.0)

deployment:
  replicas: 1

# Expose metrics on a dedicated entrypoint (port 9100)
ports:
  metrics:
    port: 9100
    expose:
      default: false
    protocol: TCP

# Create a ClusterIP service for Prometheus scraping
service:
  type: ClusterIP

# Prometheus metrics endpoint (scraped by OTel Collector)
metrics:
  addInternals: true
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true  # creates traefik-metrics ClusterIP service on port 9100

  # OTLP push metrics directly to the collector
  otlp:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    pushInterval: "10s"
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# OTLP tracing
tracing:
  addInternals: true
  serviceName: traefik
  sampleRate: 1.0
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# OTLP log export (experimental feature gate required)
experimental:
  otlpLogs: true

logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
        insecure: true
