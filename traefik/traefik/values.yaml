# Traefik Helm values — OTel Evaluation
# Chart: traefik/traefik v40.0.0 / App v3.7.0

deployment:
  replicas: 1

# ── Experimental feature gates ──────────────────────────────────────────────
experimental:
  otlpLogs: true          # enables OTLP log export (general + access logs)

# ── Tracing — OTLP gRPC ─────────────────────────────────────────────────────
tracing:
  addInternals: true        # also trace dashboard/ping internal routes
  serviceName: traefik
  sampleRate: 1.0           # 100% sampling for evaluation
  otlp:
    enabled: true
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true

# ── Metrics — OTLP gRPC push + Prometheus scrape ────────────────────────────
metrics:
  addInternals: true
  otlp:
    enabled: true
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    pushInterval: "10s"
    grpc:
      enabled: true
      endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
      insecure: true
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true         # creates traefik-metrics ClusterIP service on port 9100

# ── Logs — OTLP gRPC (requires experimental.otlpLogs: true) ─────────────────
logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json
    otlp:
      enabled: true
      grpc:
        enabled: true
        endpoint: "otel-collector-opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
        insecure: true

# ── Entrypoints ──────────────────────────────────────────────────────────────
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  metrics:
    port: 9100
    expose:
      default: false
    exposedPort: 9100
    protocol: TCP

# ── Service type (LoadBalancer stays pending in kind — use port-forward) ─────
service:
  type: LoadBalancer
