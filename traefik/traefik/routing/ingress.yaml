apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-eval-backend
  namespace: demo
  annotations:
    # Ensure Traefik handles this ingress
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
  - host: otel-eval-backend.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: otel-eval-backend
            port:
              number: 3000
