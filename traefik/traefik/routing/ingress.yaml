apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-eval-backend
  namespace: demo
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: otel-eval-backend
            port:
              number: 3000
