<!--
==============================================================================
  PROJECT CARD TEMPLATE
  Copy this entire block and paste it inside <div class="card-grid"> in
  index-template.html. Replace every {{ PLACEHOLDER }} with real values.

  TEMPLATE VARIABLES (replace all {{...}} placeholders before use):
    traefik         — lowercase slug, e.g. "emissary" (matches the
                               results/<slug>/ directory). The href is built
                               as `traefik-report.html` — do NOT
                               replace the literal `-report.html` suffix.
    Traefik       — display name, e.g. "Emissary-ingress"
    v3.7.0            — project version, e.g. "v3.12.2"
    https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png           — direct image URL for the project logo
    Ingress Controller / Reverse Proxy           — one short label, e.g. "API Gateway / Ingress"
    Cloud-native edge router and reverse proxy with native OTLP support across traces, metrics, and logs  — one-line project description

  SCORES (0–3 per dimension, used in both the score-pill class and the
  registerChart() call at the bottom):
    1, {{ SCORE_SEMANTICS }}, {{ SCORE_RESOURCES }},
    {{ SCORE_TRACING }}, 2, {{ SCORE_QUALITY }},
    {{ SCORE_STABILITY }}

  SIGNAL STATUS (one of: flowing | partial | none):
    {{ TRACES_STATUS }},  {{ TRACES_DETAIL }}
    partial, OTLP + Prometheus
    {{ LOGS_STATUS }},    {{ LOGS_DETAIL }}

  SCORE VALUES: 0 · 1 · 2 · 3  (use the matching CSS class: score-0 … score-3)
  SIGNAL STATUS classes on <span class="signal-dot ...">:
    flowing  → green  (signal fully supported via OTLP or Prometheus)
    partial  → orange (signal exists but incomplete / requires setup)
    none     → grey   (signal not supported)
==============================================================================
-->

<!-- Traefik -->
<a class="project-card" href="traefik-report.html">
  <div class="card-inner">
    <div class="card-content">

      <!-- ── Top row: logo · name · version ── -->
      <div class="card-top">
        <img class="project-logo"
             src="https://raw.githubusercontent.com/traefik/traefik/master/docs/content/assets/img/traefik.logo.png"
             alt="Traefik">
        <div class="project-name">Traefik</div>
        <span class="project-version">v3.7.0</span>
      </div>

      <!-- ── Category tag + one-line description ── -->
      <div class="card-meta">
        <span class="category-tag">Ingress Controller / Reverse Proxy</span>
        <span class="sep">&middot;</span>
        <span class="card-desc">Cloud-native edge router and reverse proxy with native OTLP support across traces, metrics, and logs</span>
      </div>

      <!--
        ── Score pills ──
        Order: Integration · Semantics · Resources · Tracing · Multi-Signal · Quality · Stability
        Set class to score-0, score-1, score-2, or score-3 for each dimension.
      -->
      <div class="score-pills">
        <span class="score-pill score-1" title="Integration">1</span>
        <span class="score-pill score-1" title="Semantics">1</span>
        <span class="score-pill score-2" title="Resources">2</span>
        <span class="score-pill score-2" title="Tracing">2</span>
        <span class="score-pill score-2" title="Multi-Signal">2</span>
        <span class="score-pill score-1" title="Quality">1</span>
        <span class="score-pill score-1" title="Stability">1</span>
      </div>

      <!--
        ── Signal pills ──
        Add or remove <span> rows as needed. Typical set: Traces, Metrics, Logs.
        dot class: flowing | partial | none
      -->
      <div class="card-signals">
        <span class="signal-pill"><span class="signal-dot flowing"></span> Traces (OTLP gRPC)</span>
        <span class="signal-pill"><span class="signal-dot partial"></span> Metrics (OTLP + Prometheus)</span>
        <span class="signal-pill"><span class="signal-dot partial"></span> Logs (OTLP (experimental))</span>
      </div>

      <div class="view-report">View report <span class="arrow">&rarr;</span></div>
    </div>

    <!-- ── Radar chart ── -->
    <div class="card-chart">
      <div class="mini-chart">
        <canvas id="chart-traefik"></canvas>
      </div>
    </div>
  </div>
</a>

<!--
  Register chart scores for this card.
  Place this <script> block right after the <a> tag above (or collect all
  registerChart() calls in a single <script> at the bottom of the file).
  Score order: Integration, Semantics, Resources, Tracing, Multi-Signal, Quality, Stability
-->
<script>
registerChart('chart-traefik', [
  1,   // Integration
  1,   // Semantics
  2,   // Resources
  2,   // Tracing
  2,   // Multi-Signal
  1,   // Quality
  1    // Stability
]);
</script>
